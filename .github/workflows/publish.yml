# Publishes to PyPI automatically when you push a version tag (v0.4.0, v1.0.0, …).
#
# PyPI Trusted Publisher must match exactly:
#   Owner:      rockybalboan19
#   Repository: SemanticRun
#   Workflow:   publish.yml
#   Environment: (leave blank)
#
# Configure at: https://pypi.org/manage/project/semarun/settings/publishing/

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
